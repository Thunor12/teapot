name: nob

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: build and test
        run: cc -o nob nob.c && ./nob

      - name: amalgam is generated and within budget
        run: |
          cc -o nob nob.c && ./nob amalgamate
          git diff --exit-code stb_teapot.h
          test "$(wc -l < stb_teapot.h)" -lt 1800
          for f in src/*.c src/*.h; do test "$(wc -l < "$f")" -lt 400; done

  fuzz:
    runs-on: ubuntu-latest
    env:
      TEAPOT_FUZZ_GRAMMAR: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: fuzz smoke
        run: cc -o nob nob.c && ./nob fuzz
